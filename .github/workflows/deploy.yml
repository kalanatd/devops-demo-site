# Runs when a pull request is merged to main (or manually).
# test -> infra (terraform apply) -> deploy (s3 sync) -> verify -> rollback if verify fails
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never run two deploys at once; queue them instead of cancelling.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TF_VERSION: "1.12.2"

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7

  infra:
    name: Terraform apply
    needs: test
    runs-on: ubuntu-latest
    # The "production" environment is where an optional manual approval lives.
    # No reviewers = Continuous Deployment. Add a reviewer = Continuous Delivery.
    environment:
      name: production
      url: ${{ steps.out.outputs.website_url }}
    outputs:
      bucket_name: ${{ steps.out.outputs.bucket_name }}
      website_url: ${{ steps.out.outputs.website_url }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -var="aws_region=${{ vars.AWS_REGION }}"

      - name: Read outputs
        id: out
        run: |
          echo "bucket_name=$(terraform output -raw bucket_name)" >> "$GITHUB_OUTPUT"
          echo "website_url=$(terraform output -raw website_url)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to S3
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload site
        run: |
          aws s3 sync dist "s3://${{ needs.infra.outputs.bucket_name }}" \
            --delete --cache-control "max-age=60"

  verify:
    name: Health check
    needs: [infra, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site serves this commit
        env:
          URL: ${{ needs.infra.outputs.website_url }}
        run: |
          expected="${GITHUB_SHA::7}"
          for attempt in 1 2 3 4 5 6; do
            live=$(curl -fsS "$URL/version.json" | jq -r .commit || true)
            if [ "$live" = "$expected" ] && curl -fsS "$URL/" | grep -q "AWS Student Builder Group"; then
              echo "Healthy: $URL is serving commit $live"
              exit 0
            fi
            echo "Attempt $attempt: live commit '$live', expected '$expected'. Retrying..."
            sleep 10
          done
          echo "::error::Health check failed for $URL"
          exit 1

  rollback:
    name: Roll back to previous commit
    needs: [infra, verify]
    if: >-
      failure() && needs.infra.result == 'success' && github.event_name == 'push' &&
      github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the previous version
        env:
          GITHUB_SHA: ${{ github.event.before }}
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Restore previous version
        run: |
          aws s3 sync dist "s3://${{ needs.infra.outputs.bucket_name }}" \
            --delete --cache-control "max-age=60"
          echo "::warning::Rolled back to ${{ github.event.before }}"
